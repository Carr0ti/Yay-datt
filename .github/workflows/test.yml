name: Test encrypted bot and Upstash

on:
  workflow_dispatch:

jobs:
  test:
    name: Account ${{ matrix.account_index }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        account_index: [0]

    concurrency:
      group: craft-world-account-${{ matrix.account_index }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Decrypt bot archive
        env:
          BOT_AGE_PRIVATE_KEY: ${{ secrets.BOT_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BOT_AGE_PRIVATE_KEY" > age-key.txt

          age --decrypt -i age-key.txt cw-bot.tar.gz.age > cw-bot.tar.gz

          mkdir extracted
          tar -xzf cw-bot.tar.gz -C extracted

          echo "Decryption successful."
          find extracted -maxdepth 1 -type f -printf '%f\n'

      - name: Create temporary wallet key file
        env:
          CRAFT_WORLD_PRIVATE_KEYS: ${{ secrets.CRAFT_WORLD_PRIVATE_KEYS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CRAFT_WORLD_PRIVATE_KEYS" > extracted/pk.txt
          chmod 600 extracted/pk.txt

          key_count=$(grep -cve '^[[:space:]]*$' extracted/pk.txt || true)
          echo "Wallet keys loaded: $key_count"

          if [ "$key_count" -eq 0 ]; then
            echo "No private keys were provided."
            exit 1
          fi

      - name: Test Upstash Redis
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            -H "Content-Type: application/json" \
            "$UPSTASH_REDIS_REST_URL/set/github_actions_test/working")

          echo "SET response: $response"

          response=$(curl -fsS \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            "$UPSTASH_REDIS_REST_URL/get/github_actions_test")

          echo "GET response: $response"

          if ! echo "$response" | grep -q '"result":"working"'; then
            echo "Upstash test failed."
            exit 1
          fi

          echo "Upstash test successful."

      - name: Run bot for selected account
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CRAFT_WORLD_ACCOUNT_INDEX: ${{ matrix.account_index }}
        run: |
          set -euo pipefail
          cd extracted

          npm ci

          echo "Starting bot for account index $CRAFT_WORLD_ACCOUNT_INDEX..."
          npm start

      - name: Remove temporary secrets and decrypted files
        if: always()
        run: |
          rm -f age-key.txt cw-bot.tar.gz
          rm -f extracted/pk.txt
          rm -rf extracted
          echo "Temporary files removed."
