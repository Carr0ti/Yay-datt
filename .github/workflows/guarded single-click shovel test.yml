
name: Diagnose CW Loading Screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Camofox
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser
          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health \
              > /tmp/camofox-health.txt 2>&1; then
              cat /tmp/camofox-health.txt
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              cat /tmp/camofox.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/camofox.log
          exit 1

      - name: Open Craft World
        shell: bash
        run: |
          set -euo pipefail

          BASE="http://127.0.0.1:9377"
          OUT="/tmp/cw-diagnostics"
          USER_ID="github-actions-cw-diagnostics"
          SESSION_KEY="cw-loading-diagnostics"

          mkdir -p "$OUT"
          echo "$USER_ID" > "$OUT/user-id.txt"

          curl -fsS --max-time 60 \
            -X POST "$BASE/tabs" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg sessionKey "$SESSION_KEY" \
              --arg url "https://craft-world.gg/" \
              '{userId:$userId,sessionKey:$sessionKey,url:$url}')" \
            | tee "$OUT/tab-response.json" | jq .

          TAB_ID=$(jq -er '.tabId' "$OUT/tab-response.json")
          echo "$TAB_ID" > "$OUT/tab-id.txt"

          echo "Waiting 30 seconds for Unity initialization..."
          sleep 30

          curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            "$BASE/tabs/$TAB_ID/snapshot" \
            -o "$OUT/accessibility-snapshot.json" || true

          echo "Accessibility snapshot:"
          jq . "$OUT/accessibility-snapshot.json" 2>/dev/null \
            || cat "$OUT/accessibility-snapshot.json" 2>/dev/null || true

          curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            -o "$OUT/before.png" \
            -w '%{http_code}' \
            "$BASE/tabs/$TAB_ID/screenshot" \
            > "$OUT/before-screenshot-status.txt" || true

          echo "Screenshot HTTP status:"
          cat "$OUT/before-screenshot-status.txt"
          file "$OUT/before.png" 2>/dev/null || true

      - name: Inspect Unity, WebGL, JavaScript and network
        shell: bash
        run: |
          set -euo pipefail

          BASE="http://127.0.0.1:9377"
          OUT="/tmp/cw-diagnostics"
          USER_ID=$(cat "$OUT/user-id.txt")
          TAB_ID=$(cat "$OUT/tab-id.txt")

          # Install instrumentation after navigation. This captures subsequent
          # errors and resource failures, but cannot recover earlier errors.
          expression='(() => {
            if (!window.__cwDiag) {
              window.__cwDiag = {
                installedAt: new Date().toISOString(),
                errors: [],
                resourceErrors: [],
                unhandledRejections: []
              };

              window.addEventListener("error", e => {
                window.__cwDiag.errors.push({
                  message: e.message || "resource error",
                  filename: e.filename || "",
                  line: e.lineno || 0,
                  column: e.colno || 0,
                  target: e.target?.src || e.target?.href || ""
                });
              }, true);

              window.addEventListener("unhandledrejection", e => {
                window.__cwDiag.unhandledRejections.push(
                  String(e.reason?.stack || e.reason)
                );
              });

              window.addEventListener("DOMContentLoaded", () => {
                window.__cwDiag.domContentLoaded = true;
              });
            }

            const canvases = [...document.querySelectorAll("canvas")].map(c => {
              const r = c.getBoundingClientRect();
              let webgl = {};
              for (const kind of ["webgl2", "webgl", "experimental-webgl"]) {
                try {
                  const ctx = c.getContext(kind);
                  webgl[kind] = !!ctx;
                  if (ctx) {
                    const gl = ctx;
                    webgl.renderer = gl.getParameter(gl.RENDERER);
                    webgl.vendor = gl.getParameter(gl.VENDOR);
                    webgl.version = gl.getParameter(gl.VERSION);
                    break;
                  }
                } catch (e) {
                  webgl[kind] = "ERROR: " + e.message;
                }
              }
              return {
                width: c.width,
                height: c.height,
                rect: {x:r.x,y:r.y,width:r.width,height:r.height},
                visible: !!(r.width && r.height),
                webgl
              };
            });

            const scripts = [...document.scripts].map(s => ({
              src: s.src,
              type: s.type,
              loaded: !!s.src
            }));

            const unity = {};
            for (const k of Object.keys(window)) {
              if (/unity|webgl|loader|createUnityInstance/i.test(k)) {
                try {
                  unity[k] = typeof window[k];
                } catch (_) {}
              }
            }

            const resourceEntries = performance.getEntriesByType("resource");
            const resources = resourceEntries.slice(-150).map(r => ({
              name: r.name.slice(0, 300),
              initiatorType: r.initiatorType,
              durationMs: Math.round(r.duration),
              transferSize: r.transferSize,
              encodedBodySize: r.encodedBodySize,
              decodedBodySize: r.decodedBodySize,
              responseEnd: Math.round(r.responseEnd)
            }));

            const loadingElements = [...document.querySelectorAll(
              "#unity-loading-bar,#unity-progress-bar-empty," +
              "#unity-progress-bar-full,#unity-warning," +
              "[id*=loading i],[class*=loading i]," +
              "[id*=progress i],[class*=progress i]"
            )].slice(0, 80).map(e => {
              const r = e.getBoundingClientRect();
              const cs = getComputedStyle(e);
              return {
                tag: e.tagName,
                id: e.id,
                className: String(e.className).slice(0, 150),
                text: (e.innerText || e.textContent || "").slice(0, 300),
                display: cs.display,
                visibility: cs.visibility,
                opacity: cs.opacity,
                rect: {x:r.x,y:r.y,width:r.width,height:r.height}
              };
            });

            return JSON.stringify({
              capturedAt: new Date().toISOString(),
              url: location.href,
              title: document.title,
              readyState: document.readyState,
              userAgent: navigator.userAgent,
              platform: navigator.platform,
              language: navigator.language,
              viewport: {width:innerWidth,height:innerHeight},
              devicePixelRatio,
              visibilityState: document.visibilityState,
              webgl: {
                webglDisabled: (() => {
                  try {
                    const c = document.createElement("canvas");
                    return !c.getContext("webgl") &&
                           !c.getContext("webgl2");
                  } catch (e) {
                    return "ERROR: " + e.message;
                  }
                })(),
                webglDebugExtensionAvailable: (() => {
                  try {
                    const c = document.createElement("canvas");
                    const gl = c.getContext("webgl") ||
                               c.getContext("webgl2");
                    return !!gl && !!gl.getExtension("WEBGL_debug_renderer_info");
                  } catch (_) {
                    return false;
                  }
                })()
              },
              canvases,
              scripts,
              unityGlobals: unity,
              loadingElements,
              bodyText: (document.body?.innerText || "").slice(0, 5000),
              resourceCount: resourceEntries.length,
              resources,
              instrumentation: window.__cwDiag
            });
          })()'

          for attempt in 1 2 3; do
            echo "Diagnostic capture attempt $attempt"

            code=$(curl -sS --max-time 40 \
              -o "$OUT/diagnostics-response.json" \
              -w '%{http_code}' \
              -X POST "$BASE/tabs/$TAB_ID/evaluate" \
              -H 'Content-Type: application/json' \
              -d "$(jq -cn \
                --arg userId "$USER_ID" \
                --arg expression "$expression" \
                '{userId:$userId,expression:$expression}')" || true)

            echo "HTTP status: $code"

            if [ "$code" = "200" ]; then
              break
            fi

            sleep 5
          done

          jq . "$OUT/diagnostics-response.json" 2>/dev/null \
            || cat "$OUT/diagnostics-response.json" 2>/dev/null || true

          if [ "$code" = "200" ]; then
            jq -r '.result // empty' "$OUT/diagnostics-response.json" \
              > "$OUT/diagnostics.json" || true

            if jq -e . "$OUT/diagnostics.json" >/dev/null 2>&1; then
              echo "Parsed diagnostics:"
              jq . "$OUT/diagnostics.json"
            else
              echo "Result was not directly parseable JSON."
            fi
          fi

          echo "Waiting 15 seconds to collect late errors..."
          sleep 15

          expression='JSON.stringify({
            capturedAt: new Date().toISOString(),
            url: location.href,
            title: document.title,
            readyState: document.readyState,
            canvasCount: document.querySelectorAll("canvas").length,
            instrumentation: window.__cwDiag || null,
            recentResources: performance.getEntriesByType("resource")
              .slice(-100).map(r => ({
                name:r.name.slice(0,250),
                durationMs:Math.round(r.duration),
                transferSize:r.transferSize,
                encodedBodySize:r.encodedBodySize
              }))
          })'

          curl -sS --max-time 40 \
            -X POST "$BASE/tabs/$TAB_ID/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')" \
            -o "$OUT/late-diagnostics-response.json" || true

          jq . "$OUT/late-diagnostics-response.json" 2>/dev/null \
            || cat "$OUT/late-diagnostics-response.json" 2>/dev/null || true

          jq -r '.result // empty' "$OUT/late-diagnostics-response.json" \
            > "$OUT/late-diagnostics.json" || true

          jq . "$OUT/late-diagnostics.json" 2>/dev/null || true

          curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            -o "$OUT/after.png" \
            -w '%{http_code}' \
            "$BASE/tabs/$TAB_ID/screenshot" \
            > "$OUT/after-screenshot-status.txt" || true

          echo "Final screenshot status:"
          cat "$OUT/after-screenshot-status.txt"
          file "$OUT/after.png" 2>/dev/null || true

      - name: Save server logs and runtime information
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cw-diagnostics

          if [ -f /tmp/camofox.log ]; then
            cp /tmp/camofox.log /tmp/cw-diagnostics/camofox-server.log
            tail -n 250 /tmp/camofox.log
          fi

          if [ -d /tmp/camofox-browser ]; then
            cd /tmp/camofox-browser
            node --version > /tmp/cw-diagnostics/node-version.txt
            npm --version > /tmp/cw-diagnostics/npm-version.txt
            npm list --depth=0 \
              > /tmp/cw-diagnostics/npm-dependencies.txt 2>&1 || true
          fi

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-world-loading-diagnostics
          path: /tmp/cw-diagnostics/
          if-no-files-found: warn
          retention-days: 3
