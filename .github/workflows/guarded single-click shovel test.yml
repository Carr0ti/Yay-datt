
name: Test Craft World Mining Click

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  click-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.1.0"

      - name: Install Camofox
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser

          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health \
              > /tmp/camofox-health.txt 2>&1; then
              echo "Camofox is ready."
              cat /tmp/camofox-health.txt
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              echo "Camofox stopped during startup."
              cat /tmp/camofox.log
              exit 1
            fi

            sleep 2
          done

          echo "Camofox did not become ready."
          cat /tmp/camofox.log
          exit 1

      - name: Open Craft World and inspect page
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          SESSION_KEY="craft-world-mining-click-test"
          OUT="/tmp/craft-world-click-test"

          mkdir -p "$OUT"

          echo "Opening Craft World without connecting a wallet."

          tab_response=$(curl -fsS --max-time 60 \
            -X POST "$BASE_URL/tabs" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg sessionKey "$SESSION_KEY" \
              --arg url "https://craft-world.gg/" \
              '{userId:$userId,sessionKey:$sessionKey,url:$url}')")

          printf '%s\n' "$tab_response" \
            | tee "$OUT/tab-response.json" | jq .

          tab_id=$(printf '%s' "$tab_response" | jq -er '.tabId')

          echo "Waiting for the game to load..."
          sleep 20

          # Read page state without clicking anything.
          expression='JSON.stringify({
            url: location.href,
            title: document.title,
            readyState: document.readyState,
            viewport: {
              width: innerWidth,
              height: innerHeight
            },
            canvases: [...document.querySelectorAll("canvas")].map(c => {
              const r = c.getBoundingClientRect();
              return {
                width: c.width,
                height: c.height,
                x: r.x,
                y: r.y,
                displayWidth: r.width,
                displayHeight: r.height
              };
            })
          })'

          state_code=$(curl -sS --max-time 30 \
            -o "$OUT/pre-click-state.json" \
            -w '%{http_code}' \
            -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')" \
            || true)

          echo "Page inspection HTTP status: $state_code"
          cat "$OUT/pre-click-state.json"
          echo

          if [ "$state_code" != "200" ]; then
            echo "Page inspection failed. Camofox logs:"
            tail -n 150 /tmp/camofox.log
            exit 1
          fi

          jq . "$OUT/pre-click-state.json"

          state_json=$(jq -er '.result | fromjson' \
            "$OUT/pre-click-state.json")

          page_url=$(printf '%s' "$state_json" | jq -er '.url')
          canvas_count=$(printf '%s' "$state_json" \
            | jq -er '.canvases | length')
          viewport_width=$(printf '%s' "$state_json" \
            | jq -er '.viewport.width')
          viewport_height=$(printf '%s' "$state_json" \
            | jq -er '.viewport.height')

          echo "Page URL: $page_url"
          echo "Canvas count: $canvas_count"
          echo "Viewport: ${viewport_width}x${viewport_height}"

          if [[ "$page_url" != "https://craft-world.gg/" &&
                "$page_url" != "https://craft-world.gg" ]]; then
            echo "Unexpected page URL. No click will be attempted."
            exit 1
          fi

          if [ "$canvas_count" -lt 1 ] ||
             [ "$viewport_width" -lt 1000 ] ||
             [ "$viewport_height" -lt 700 ]; then
            echo "Page checks failed. No click will be attempted."
            exit 1
          fi

          # Save the actual screenshot before testing.
          before_code=$(curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            -o "$OUT/before-click.png" \
            -w '%{http_code}' \
            "$BASE_URL/tabs/$tab_id/screenshot" || true)

          echo "Before screenshot HTTP status: $before_code"

          if [ "$before_code" != "200" ]; then
            echo "Screenshot request failed:"
            cat "$OUT/before-click.png" 2>/dev/null || true
            tail -n 100 /tmp/camofox.log
            exit 1
          fi

          file "$OUT/before-click.png"

          # Save identifiers for the next step.
          printf '%s\n' "$tab_id" > "$OUT/tab-id.txt"
          printf '%s\n' "$USER_ID" > "$OUT/user-id.txt"

      - name: Attempt one guarded canvas click with diagnostics
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          OUT="/tmp/craft-world-click-test"

          USER_ID=$(cat "$OUT/user-id.txt")
          tab_id=$(cat "$OUT/tab-id.txt")

          state_json=$(jq -er '.result | fromjson' \
            "$OUT/pre-click-state.json")

          viewport_width=$(printf '%s' "$state_json" \
            | jq -er '.viewport.width')
          viewport_height=$(printf '%s' "$state_json" \
            | jq -er '.viewport.height')

          # Approximate target based on the previously supplied screenshot.
          click_x=$(awk -v w="$viewport_width" \
            'BEGIN { printf "%d", w * 0.483 }')
          click_y=$(awk -v h="$viewport_height" \
            'BEGIN { printf "%d", h * 0.614 }')

          echo "Viewport: ${viewport_width}x${viewport_height}"
          echo "Planned click: x=$click_x y=$click_y"

          # Synthetic events are diagnostic only. Some games ignore them.
          # Do not send events unless the target is the canvas.
          expression="(()=> {
            const x = $click_x;
            const y = $click_y;
            const el = document.elementFromPoint(x, y);

            if (!el || el.tagName.toLowerCase() !== 'canvas') {
              return JSON.stringify({
                ok: false,
                error: 'Target is not a canvas; no events sent',
                target: el ? el.tagName : null,
                x, y
              });
            }

            const common = {
              bubbles: true,
              cancelable: true,
              clientX: x,
              clientY: y,
              button: 0,
              view: window
            };

            el.dispatchEvent(new PointerEvent('pointermove', {
              ...common,
              pointerId: 1,
              pointerType: 'mouse',
              isPrimary: true,
              buttons: 0
            }));

            el.dispatchEvent(new MouseEvent('mousemove', {
              ...common,
              buttons: 0
            }));

            el.dispatchEvent(new PointerEvent('pointerdown', {
              ...common,
              pointerId: 1,
              pointerType: 'mouse',
              isPrimary: true,
              buttons: 1
            }));

            el.dispatchEvent(new MouseEvent('mousedown', {
              ...common,
              buttons: 1
            }));

            el.dispatchEvent(new PointerEvent('pointerup', {
              ...common,
              pointerId: 1,
              pointerType: 'mouse',
              isPrimary: true,
              buttons: 0
            }));

            el.dispatchEvent(new MouseEvent('mouseup', {
              ...common,
              buttons: 0
            }));

            el.dispatchEvent(new MouseEvent('click', {
              ...common,
              buttons: 0
            }));

            return JSON.stringify({
              ok: true,
              method: 'synthetic canvas events',
              x, y,
              target: el.tagName,
              warning: 'This is not a trusted physical mouse click'
            });
          })()"

          echo "Sending the guarded test request..."

          # Capture the response body even if Camofox returns HTTP 500.
          http_code=$(curl -sS --max-time 30 \
            -o "$OUT/camofox-error.txt" \
            -w '%{http_code}' \
            -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')" \
            || true)

          echo "Camofox evaluate HTTP status: $http_code"
          echo "Camofox response body:"
          cat "$OUT/camofox-error.txt" 2>/dev/null || true
          echo

          echo "Recent Camofox server log:"
          tail -n 150 /tmp/camofox.log \
            | tee "$OUT/camofox-server.log"

          if [ "$http_code" != "200" ]; then
            echo "Evaluate request failed. Stopping; no successful click is claimed."
            exit 1
          fi

          click_response=$(cat "$OUT/camofox-error.txt")
          printf '%s\n' "$click_response" \
            | tee "$OUT/click-response.json" | jq .

          result=$(printf '%s' "$click_response" \
            | jq -er '.result | fromjson')

          if [ "$(printf '%s' "$result" | jq -r '.ok')" != "true" ]; then
            echo "Target check failed; no click events were sent."
            exit 1
          fi

          echo "Test events were dispatched. Waiting five seconds..."
          sleep 5

          after_code=$(curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            -o "$OUT/after-click.png" \
            -w '%{http_code}' \
            "$BASE_URL/tabs/$tab_id/screenshot" || true)

          echo "After screenshot HTTP status: $after_code"

          if [ "$after_code" != "200" ]; then
            echo "Post-test screenshot failed."
            cat "$OUT/after-click.png" 2>/dev/null || true
            exit 1
          fi

          file "$OUT/after-click.png"
          echo "Post-test screenshot saved."

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-world-mining-click-test
          path: /tmp/craft-world-click-test/
          if-no-files-found: warn
          retention-days: 3

      - name: Print Camofox logs
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/camofox.log ]; then
            echo "Final Camofox log:"
            tail -n 150 /tmp/camofox.log
          else
            echo "Camofox log file not found."
          fi
