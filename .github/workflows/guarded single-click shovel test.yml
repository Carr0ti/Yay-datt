name: CW Click Yellow then Green Button

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python deps
        run: pip install pillow numpy scipy

      - name: Install Camofox
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser
          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health >/dev/null 2>&1; then
              echo "Camofox is up"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              cat /tmp/camofox.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/camofox.log
          exit 1

      - name: Write bot script
        shell: bash
        run: |
          mkdir -p /tmp/out
          cat > /tmp/bot.py <<'PY'
          import io, json, sys, time, urllib.parse, urllib.request
          import numpy as np
          from PIL import Image
          from scipy import ndimage

          BASE = "http://127.0.0.1:9377"
          USER = "github-actions-cw"
          OUT = "/tmp/out"

          # ---- tunables -------------------------------------------------
          LOAD_TIMEOUT = 150          # seconds to wait for the game
          SETTLE_SECONDS = 5          # extra wait after "ready"
          MIN_BLOB = 300              # min yellow pixels to count as button
          # ignore HUD: top bar and bottom menu, as fractions of the screen
          # height (Camofox picks a different window size on every run)
          Y_MIN_FRAC, Y_MAX_FRAC = 0.14, 0.92
          CLICK_RETRIES = 3
          # ---------------------------------------------------------------


          def post(path, body, timeout=60):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode())


          def evaluate(tab, expr):
              res = post(f"/tabs/{tab}/evaluate",
                         {"userId": USER, "expression": expr}, timeout=40)
              return res.get("result")


          def screenshot(tab, name=None):
              q = urllib.parse.urlencode({"userId": USER})
              with urllib.request.urlopen(
                      f"{BASE}/tabs/{tab}/screenshot?{q}", timeout=40) as r:
                  data = r.read()
              if name:
                  open(f"{OUT}/{name}.png", "wb").write(data)
              return Image.open(io.BytesIO(data)).convert("RGB")


          READY_JS = """(() => {
            const n = performance.getEntriesByType('resource').map(r => r.name);
            return JSON.stringify({
              scene: n.some(x => x.includes('corescenes_scenes_mainscene')),
              plot: n.some(x => x.includes('landplotearth.prefab')),
              config: n.some(x => x.includes('client-config/config.json')),
              canvas: document.querySelectorAll('canvas').length
            });
          })()"""


          def is_loading_screen(img):
              # pink progress bar: a row where over half the width is pink
              a = np.array(img).astype(int)
              m = (a[..., 0] > 200) & (a[..., 1] < 110) & (a[..., 2] < 130)
              return bool((m.sum(axis=1) > a.shape[1] * 0.5).any())


          def find_button(img, kind):
              a = np.array(img).astype(int)
              r, g, b = a[..., 0], a[..., 1], a[..., 2]
              if kind == "yellow":      # build (wrench) button
                  m = (r > 230) & (g > 170) & (g < 215) & (b < 90)
              else:                     # green play / earth mining button
                  m = (g > 170) & (r < 110) & (b < 130) & (g - r > 90)
              h = m.shape[0]
              m[:int(h * Y_MIN_FRAC), :] = False
              m[int(h * Y_MAX_FRAC):, :] = False
              lab, n = ndimage.label(m)
              if n == 0:
                  return None
              sizes = ndimage.sum(m, lab, range(1, n + 1))
              best = int(np.argmax(sizes)) + 1
              if sizes[best - 1] < MIN_BLOB:
                  return None
              cy, cx = ndimage.center_of_mass(m, lab, best)
              return int(cx), int(cy), int(sizes[best - 1])


          def mouse_js(types, x, y, buttons):
              return """(() => {
                const c = document.querySelector('canvas');
                const o = {clientX:%d, clientY:%d, screenX:%d, screenY:%d,
                  bubbles:true, cancelable:true, button:0,
                  buttons:%d, pointerId:1, pointerType:'mouse', isPrimary:true};
                %s.forEach(t => {
                  const C = t.startsWith('pointer') ? PointerEvent : MouseEvent;
                  c.dispatchEvent(new C(t, o));
                });
                return 'ok';
              })()""" % (x, y, x, y, buttons, json.dumps(types))


          def click(tab, x, y):
              evaluate(tab, mouse_js(["pointermove", "mousemove"], x, y, 0))
              evaluate(tab, mouse_js(["pointerdown", "mousedown"], x, y, 1))
              time.sleep(0.15)
              evaluate(tab, mouse_js(["pointerup", "mouseup", "click"], x, y, 0))


          def main():
              tab = post("/tabs", {
                  "userId": USER,
                  "sessionKey": "cw-click",
                  "url": "https://craft-world.gg/",
              })["tabId"]
              print("tab:", tab)

              # ---- wait until inside the game ----
              start = time.time()
              ready = False
              while time.time() - start < LOAD_TIMEOUT:
                  time.sleep(3)
                  try:
                      st = json.loads(evaluate(tab, READY_JS))
                      img = screenshot(tab)
                  except Exception as e:
                      print("poll error:", e)
                      continue
                  loading = is_loading_screen(img)
                  print(f"{int(time.time()-start)}s net={st} loading={loading}")
                  if st["scene"] and st["plot"] and st["config"] and not loading:
                      ready = True
                      break

              if not ready:
                  screenshot(tab, "timeout")
                  print("FAILED: game did not finish loading")
                  sys.exit(1)

              time.sleep(SETTLE_SECONDS)

              # ---- click yellow (build), then green (earth mining) ----
              for kind in ("yellow", "green"):
                  done = False
                  for attempt in range(1, CLICK_RETRIES + 1):
                      img = screenshot(tab, f"{kind}-before-{attempt}")
                      hit = find_button(img, kind)
                      if not hit:
                          print(f"{kind} attempt {attempt}: button not found")
                          time.sleep(3)
                          continue

                      x, y, size = hit
                      print(f"{kind} attempt {attempt}: clicking ({x},{y}) size={size}")
                      click(tab, x, y)
                      time.sleep(3)

                      after = screenshot(tab, f"{kind}-after-{attempt}")
                      hit2 = find_button(after, kind)
                      if hit2 is None or abs(hit2[0] - x) + abs(hit2[1] - y) > 40:
                          print(f"SUCCESS: {kind} button clicked, screen changed")
                          done = True
                          break
                      print("button still there, retrying")

                  if not done:
                      print(f"FAILED: could not click the {kind} button")
                      sys.exit(1)
                  time.sleep(2)


          main()
          PY

      - name: Run bot
        shell: bash
        run: python3 /tmp/bot.py

      - name: Save logs
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp /tmp/camofox.log /tmp/out/camofox-server.log 2>/dev/null || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-click-output
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 3
