
name: Test Craft World Mining Click

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  click-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Camofox
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser

          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health; then
              echo
              echo "Camofox is ready."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              cat /tmp/camofox.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/camofox.log
          exit 1

      - name: Open game and capture initial screenshot
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          SESSION_KEY="craft-world-mining-click-test"
          OUT="/tmp/craft-world-click-test"

          mkdir -p "$OUT"

          # Open Craft World without connecting a wallet.
          tab_response=$(curl -fsS --max-time 60 \
            -X POST "$BASE_URL/tabs" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg sessionKey "$SESSION_KEY" \
              --arg url "https://craft-world.gg/" \
              '{userId:$userId,sessionKey:$sessionKey,url:$url}')")

          printf '%s\n' "$tab_response" \
            | tee "$OUT/tab-response.json" | jq .

          tab_id=$(printf '%s' "$tab_response" | jq -er '.tabId')

          echo "Waiting for the game page..."
          sleep 20

          # Read the page and canvas dimensions.
          expression='JSON.stringify({
            url: location.href,
            title: document.title,
            readyState: document.readyState,
            viewport: {
              width: innerWidth,
              height: innerHeight
            },
            canvases: [...document.querySelectorAll("canvas")].map(c => {
              const r = c.getBoundingClientRect();
              return {
                width: c.width,
                height: c.height,
                x: r.x,
                y: r.y,
                displayWidth: r.width,
                displayHeight: r.height
              };
            })
          })'

          state_response=$(curl -fsS --max-time 30 \
            -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')")

          printf '%s\n' "$state_response" \
            | tee "$OUT/pre-click-state.json" | jq .

          state_json=$(printf '%s' "$state_response" \
            | jq -er '.result | fromjson')

          page_url=$(printf '%s' "$state_json" | jq -er '.url')
          canvas_count=$(printf '%s' "$state_json" \
            | jq -er '.canvases | length')
          viewport_width=$(printf '%s' "$state_json" \
            | jq -er '.viewport.width')
          viewport_height=$(printf '%s' "$state_json" \
            | jq -er '.viewport.height')

          # Stop if the expected page or canvas is missing.
          if [[ "$page_url" != "https://craft-world.gg/" &&
                "$page_url" != "https://craft-world.gg" ]]; then
            echo "Unexpected page URL. No click sent."
            exit 1
          fi

          if [ "$canvas_count" -lt 1 ] ||
             [ "$viewport_width" -lt 1000 ] ||
             [ "$viewport_height" -lt 700 ]; then
            echo "Canvas or viewport check failed. No click sent."
            exit 1
          fi

          # Save a real PNG screenshot before the test.
          curl -fsS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            "$BASE_URL/tabs/$tab_id/screenshot" \
            -o "$OUT/before-click.png"

          file "$OUT/before-click.png"
          echo "Initial screenshot saved."

      - name: Attempt one guarded canvas click
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          OUT="/tmp/craft-world-click-test"
          tab_id=$(jq -er '.tabId' "$OUT/tab-response.json")

          state_json=$(jq -er '.result | fromjson' \
            "$OUT/pre-click-state.json")

          viewport_width=$(printf '%s' "$state_json" \
            | jq -er '.viewport.width')
          viewport_height=$(printf '%s' "$state_json" \
            | jq -er '.viewport.height')

          # Approximate shovel location from the screenshot supplied earlier.
          click_x=$(awk -v w="$viewport_width" \
            'BEGIN { printf "%d", w * 0.483 }')
          click_y=$(awk -v h="$viewport_height" \
            'BEGIN { printf "%d", h * 0.614 }')

          echo "Viewport: ${viewport_width}x${viewport_height}"
          echo "Planned single click: x=$click_x y=$click_y"

          # This dispatches synthetic events; it is not a trusted mouse click.
          # Require the target at the chosen coordinates to be a canvas.
          expression="(()=> {
            const x = $click_x;
            const y = $click_y;
            const el = document.elementFromPoint(x, y);

            if (!el || el.tagName.toLowerCase() !== 'canvas') {
              return JSON.stringify({
                ok: false,
                error: 'Target is not a canvas; no events sent',
                target: el ? el.tagName : null,
                x, y
              });
            }

            const common = {
              bubbles: true,
              cancelable: true,
              clientX: x,
              clientY: y,
              button: 0,
              view: window
            };

            el.dispatchEvent(new PointerEvent('pointermove', {
              ...common, pointerId: 1, pointerType: 'mouse',
              isPrimary: true, buttons: 0
            }));

            el.dispatchEvent(new MouseEvent('mousemove', {
              ...common, buttons: 0
            }));

            el.dispatchEvent(new PointerEvent('pointerdown', {
              ...common, pointerId: 1, pointerType: 'mouse',
              isPrimary: true, buttons: 1
            }));

            el.dispatchEvent(new MouseEvent('mousedown', {
              ...common, buttons: 1
            }));

            el.dispatchEvent(new PointerEvent('pointerup', {
              ...common, pointerId: 1, pointerType: 'mouse',
              isPrimary: true, buttons: 0
            }));

            el.dispatchEvent(new MouseEvent('mouseup', {
              ...common, buttons: 0
            }));

            el.dispatchEvent(new MouseEvent('click', {
              ...common, buttons: 0
            }));

            return JSON.stringify({
              ok: true,
              method: 'synthetic canvas events',
              x, y,
              target: el.tagName,
              warning: 'Game may ignore synthetic events'
            });
          })()"

          click_response=$(curl -fsS --max-time 30 \
            -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')")

          printf '%s\n' "$click_response" \
            | tee "$OUT/click-response.json" | jq .

          result=$(printf '%s' "$click_response" \
            | jq -er '.result | fromjson')

          if [ "$(printf '%s' "$result" | jq -r '.ok')" != "true" ]; then
            echo "Target check failed. No click events were sent."
            exit 1
          fi

          echo "Waiting five seconds after the event test..."
          sleep 5

          # Capture the real post-test screenshot.
          curl -fsS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            "$BASE_URL/tabs/$tab_id/screenshot" \
            -o "$OUT/after-click.png"

          file "$OUT/after-click.png"
          echo "Post-test screenshot saved."

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-world-mining-click-test
          path: /tmp/craft-world-click-test/
          if-no-files-found: warn
          retention-days: 3

      - name: Print Camofox logs
        if: always()
        run: |
          if [ -f /tmp/camofox.log ]; then
            tail -n 150 /tmp/camofox.log
          fi
