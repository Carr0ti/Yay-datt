
name: Test CW Mining Click

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  click-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Camofox
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser

          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health \
              > /tmp/camofox-health.txt 2>&1; then
              echo "Camofox is ready."
              cat /tmp/camofox-health.txt
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              echo "Camofox stopped during startup."
              cat /tmp/camofox.log
              exit 1
            fi

            sleep 2
          done

          echo "Camofox did not become ready."
          cat /tmp/camofox.log
          exit 1

      - name: Open Craft World and inspect page
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          SESSION_KEY="craft-world-mining-click-test"
          OUT="/tmp/craft-world-click-test"

          mkdir -p "$OUT"

          echo "Opening Craft World without connecting a wallet."

          tab_response=$(curl -fsS --max-time 60 \
            -X POST "$BASE_URL/tabs" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg sessionKey "$SESSION_KEY" \
              --arg url "https://craft-world.gg/" \
              '{userId:$userId,sessionKey:$sessionKey,url:$url}')")

          printf '%s\n' "$tab_response" \
            | tee "$OUT/tab-response.json" | jq .

          tab_id=$(printf '%s' "$tab_response" | jq -er '.tabId')

          echo "$tab_id" > "$OUT/tab-id.txt"
          echo "$USER_ID" > "$OUT/user-id.txt"

          echo "Waiting for initial page load..."
          sleep 20

          expression='JSON.stringify({
            url: location.href,
            title: document.title,
            readyState: document.readyState,
            bodyText: (document.body?.innerText || "").slice(0, 3000),
            viewport: {
              width: innerWidth,
              height: innerHeight
            },
            canvases: [...document.querySelectorAll("canvas")].map(c => {
              const r = c.getBoundingClientRect();
              return {
                width: c.width,
                height: c.height,
                x: r.x,
                y: r.y,
                displayWidth: r.width,
                displayHeight: r.height
              };
            }),
            resources: performance.getEntriesByType("resource")
              .filter(r => /\.(js|wasm|json)(\?|$)/i.test(r.name))
              .slice(-50)
              .map(r => ({
                url: r.name.slice(0, 250),
                duration: Math.round(r.duration),
                transferSize: r.transferSize
              }))
          })'

          state_code=$(curl -sS --max-time 30 \
            -o "$OUT/page-diagnostics.json" \
            -w '%{http_code}' \
            -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')" \
            || true)

          echo "Page diagnostics HTTP status: $state_code"
          jq . "$OUT/page-diagnostics.json" 2>/dev/null \
            || cat "$OUT/page-diagnostics.json" 2>/dev/null || true

          if [ "$state_code" != "200" ]; then
            echo "Could not inspect the page."
            tail -n 150 /tmp/camofox.log
            exit 1
          fi

          state_json=$(jq -er '.result | fromjson' \
            "$OUT/page-diagnostics.json")

          printf '%s\n' "$state_json" \
            | tee "$OUT/page-state.json" | jq .

          page_url=$(printf '%s' "$state_json" | jq -r '.url')
          viewport_width=$(printf '%s' "$state_json" \
            | jq -r '.viewport.width')
          viewport_height=$(printf '%s' "$state_json" \
            | jq -r '.viewport.height')

          echo "Page URL: $page_url"
          echo "Viewport: ${viewport_width}x${viewport_height}"

          before_code=$(curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            -o "$OUT/before-click.png" \
            -w '%{http_code}' \
            "$BASE_URL/tabs/$tab_id/screenshot" || true)

          echo "Before screenshot HTTP status: $before_code"
          file "$OUT/before-click.png" 2>/dev/null || true

          if [ "$before_code" != "200" ]; then
            echo "Screenshot failed."
            exit 1
          fi

          if [[ "$page_url" != "https://craft-world.gg/" &&
                "$page_url" != "https://craft-world.gg" ]]; then
            echo "Unexpected URL; native click will be skipped."
            exit 1
          fi

          if [ "$viewport_width" -lt 1000 ] ||
             [ "$viewport_height" -lt 700 ]; then
            echo "Unexpected viewport; native click will be skipped."
            exit 1
          fi

      - name: Attempt one native browser click
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          OUT="/tmp/craft-world-click-test"

          USER_ID=$(cat "$OUT/user-id.txt")
          tab_id=$(cat "$OUT/tab-id.txt")

          state_json=$(jq -er '.' "$OUT/page-state.json")

          viewport_width=$(printf '%s' "$state_json" \
            | jq -er '.viewport.width')
          viewport_height=$(printf '%s' "$state_json" \
            | jq -er '.viewport.height')

          click_x=$(awk -v w="$viewport_width" \
            'BEGIN { printf "%d", w * 0.483 }')
          click_y=$(awk -v h="$viewport_height" \
            'BEGIN { printf "%d", h * 0.614 }')

          echo "Viewport: ${viewport_width}x${viewport_height}"
          echo "Attempting native click at x=$click_x y=$click_y"

          click_code=$(curl -sS --max-time 30 \
            -o "$OUT/native-click-response.json" \
            -w '%{http_code}' \
            -X POST "$BASE_URL/tabs/$tab_id/click" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --argjson x "$click_x" \
              --argjson y "$click_y" \
              '{userId:$userId,coordinates:{x:$x,y:$y}}')" \
            || true)

          echo "Native click HTTP status: $click_code"
          jq . "$OUT/native-click-response.json" 2>/dev/null \
            || cat "$OUT/native-click-response.json" 2>/dev/null \
            || true

          if [ "$click_code" != "200" ]; then
            echo "Native click was rejected. See response above."
            echo "No successful click is claimed."
          else
            echo "Click endpoint accepted the request."
            echo "This does not prove the game registered the click."
          fi

          echo "Waiting five seconds before taking another screenshot..."
          sleep 5

          after_code=$(curl -sS --max-time 30 --get \
            --data-urlencode "userId=$USER_ID" \
            -o "$OUT/after-click.png" \
            -w '%{http_code}' \
            "$BASE_URL/tabs/$tab_id/screenshot" || true)

          echo "After-click screenshot HTTP status: $after_code"
          file "$OUT/after-click.png" 2>/dev/null || true

          if [ "$after_code" != "200" ]; then
            echo "Could not capture the after-click screenshot."
          fi

          echo "Collecting final page state..."

          expression='JSON.stringify({
            url: location.href,
            title: document.title,
            readyState: document.readyState,
            bodyText: (document.body?.innerText || "").slice(0, 3000),
            canvasCount: document.querySelectorAll("canvas").length,
            resources: performance.getEntriesByType("resource")
              .filter(r => r.duration > 0)
              .slice(-30)
              .map(r => ({
                url: r.name.slice(0, 250),
                duration: Math.round(r.duration),
                transferSize: r.transferSize
              }))
          })'

          final_code=$(curl -sS --max-time 30 \
            -o "$OUT/final-page-state.json" \
            -w '%{http_code}' \
            -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn \
              --arg userId "$USER_ID" \
              --arg expression "$expression" \
              '{userId:$userId,expression:$expression}')" \
            || true)

          echo "Final page inspection HTTP status: $final_code"
          jq . "$OUT/final-page-state.json" 2>/dev/null \
            || cat "$OUT/final-page-state.json" 2>/dev/null || true

          echo "Recent Camofox logs:"
          tail -n 150 /tmp/camofox.log \
            | tee "$OUT/camofox-server.log"

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-world-mining-click-test
          path: /tmp/craft-world-click-test/
          if-no-files-found: warn
          retention-days: 3

      - name: Print final Camofox logs
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/camofox.log ]; then
            tail -n 150 /tmp/camofox.log
          else
            echo "Camofox log file not found."
          fi
