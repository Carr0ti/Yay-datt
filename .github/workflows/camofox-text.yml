
name: Test Camofox Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Install Camofox
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser

          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health; then
              echo
              echo "Camofox server is responding."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              echo "Camofox stopped unexpectedly."
              cat /tmp/camofox.log
              exit 1
            fi

            sleep 2
          done

          echo "Camofox health check timed out."
          cat /tmp/camofox.log
          exit 1

      - name: Open Craft World and inspect page
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          SESSION_KEY="craft-world-smoke-test"
          TARGET_URL="https://craft-world.gg"

          echo "Opening Craft World..."

          tab_response=$(curl \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            -fsS \
            -X POST "$BASE_URL/tabs" \
            -H 'Content-Type: application/json' \
            -d "{
              \"userId\": \"$USER_ID\",
              \"sessionKey\": \"$SESSION_KEY\",
              \"url\": \"$TARGET_URL\"
            }")

          echo "$tab_response" | jq .

          tab_id=$(echo "$tab_response" | jq -er '.tabId')
          echo "Tab ID: $tab_id"

          mkdir -p /tmp/craft-world-test

          echo "Waiting for the page to load..."

          curl -fsS \
            -X POST "$BASE_URL/tabs/$tab_id/wait" \
            -H 'Content-Type: application/json' \
            -d "{
              \"userId\": \"$USER_ID\",
              \"timeout\": 15000
            }" || echo "Wait request returned an error; continuing."

          sleep 5

          echo "Trying to read the accessibility snapshot..."

          for attempt in 1 2 3 4; do
            echo "Snapshot attempt $attempt..."

            if curl -fsS --get \
              --data-urlencode "userId=$USER_ID" \
              "$BASE_URL/tabs/$tab_id/snapshot" \
              -o /tmp/craft-world-test/snapshot.json; then

              snapshot=$(jq -r '.snapshot // empty' \
                /tmp/craft-world-test/snapshot.json)

              if [ -n "$snapshot" ]; then
                echo "Snapshot retrieved successfully."
                break
              fi

              echo "Snapshot is empty; retrying..."
            else
              echo "Snapshot request failed; retrying..."
            fi

            sleep 5
          done

          if [ -f /tmp/craft-world-test/snapshot.json ]; then
            echo "Snapshot metadata:"
            jq '{
              url,
              refsCount,
              totalChars,
              truncated,
              snapshot
            }' /tmp/craft-world-test/snapshot.json
          fi

          echo "Capturing browser screenshot..."

          if curl -fsS --get \
            --data-urlencode "userId=$USER_ID" \
            "$BASE_URL/tabs/$tab_id/screenshot" \
            -o /tmp/craft-world-test/craft-world.png; then
            echo "Screenshot saved."
          else
            echo "Screenshot capture failed."
            rm -f /tmp/craft-world-test/craft-world.png
          fi

          echo "Getting page links..."

          if curl -fsS --get \
            --data-urlencode "userId=$USER_ID" \
            "$BASE_URL/tabs/$tab_id/links" \
            -o /tmp/craft-world-test/links.json; then
            jq . /tmp/craft-world-test/links.json \
              || cat /tmp/craft-world-test/links.json
          else
            echo "Could not retrieve page links."
          fi

          echo
          echo "Browser inspection finished."
          echo "Check the uploaded screenshot and snapshot to diagnose the page."

      - name: Upload Craft World diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-world-browser-diagnostics
          path: /tmp/craft-world-test/
          if-no-files-found: warn
          retention-days: 3

      - name: Print Camofox logs
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/camofox.log ]; then
            tail -n 150 /tmp/camofox.log
          fi
