
name: Test Camofox Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Install Camofox
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser

          cd /tmp/camofox-browser
          npm install

      - name: Start Camofox
        shell: bash
        run: |
          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -fsS \
              http://127.0.0.1:9377/health; then
              echo
              echo "Camofox server is responding."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              echo "Camofox process stopped."
              cat /tmp/camofox.log
              exit 1
            fi

            sleep 2
          done

          echo "Camofox health check timed out."
          cat /tmp/camofox.log
          exit 1

      - name: Open Craft World and read snapshot
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          SESSION_KEY="craft-world-smoke-test"
          TARGET_URL="https://craft-world.gg"

          echo "Opening $TARGET_URL ..."

          tab_response=$(curl \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            -fsS \
            -X POST "$BASE_URL/tabs" \
            -H 'Content-Type: application/json' \
            -d "{
              \"userId\": \"$USER_ID\",
              \"sessionKey\": \"$SESSION_KEY\",
              \"url\": \"$TARGET_URL\"
            }")

          echo "$tab_response" | jq .

          tab_id=$(echo "$tab_response" | jq -er '.tabId')

          echo "Tab ID: $tab_id"
          echo "Waiting for the page to load..."
          sleep 10

          echo "Reading Craft World page snapshot..."

          snapshot_response=$(curl \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            -fsS \
            --get \
            --data-urlencode "userId=$USER_ID" \
            "$BASE_URL/tabs/$tab_id/snapshot")

          echo "$snapshot_response" | jq '{
            url: .url,
            snapshot: .snapshot
          }'

          page_url=$(echo "$snapshot_response" | jq -r '.url // empty')
          snapshot=$(echo "$snapshot_response" | jq -r '.snapshot // empty')

          if [ -z "$page_url" ]; then
            echo "FAIL: No page URL was returned."
            exit 1
          fi

          if [ -z "$snapshot" ]; then
            echo "FAIL: The page snapshot is empty."
            exit 1
          fi

          echo
          echo "PASS: Camofox opened a page and retrieved a non-empty snapshot."
          echo "Final URL: $page_url"

          if [[ "$page_url" == *"craft-world.gg"* ]]; then
            echo "The final URL belongs to craft-world.gg."
          else
            echo "NOTICE: The page redirected to another URL."
            echo "Inspect the snapshot to identify a login or challenge page."
          fi

      - name: Print Camofox logs
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/camofox.log ]; then
            tail -n 150 /tmp/camofox.log
          fi
