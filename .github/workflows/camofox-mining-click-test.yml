name: Test Craft World Mining Click

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  click-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Camofox
        run: |
          git clone --depth 1 \
            https://github.com/jo-inc/camofox-browser.git \
            /tmp/camofox-browser
          cd /tmp/camofox-browser
          npm install

      - name: Enable coordinate clicks in this runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/camofox-browser/server.js")
          s = p.read_text()

          old = "const { userId, ref, selector } = req.body;"
          new = "const { userId, ref, selector, coordinates } = req.body;"
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate the click handler.")
          s = s.replace(old, new, 1)

          old = """if (!ref && !selector) {
            return res.status(400).json({ error: 'ref or selector required' });
          }"""
          new = """if (!ref && !selector && !coordinates) {
            return res.status(400).json({ error: 'ref, selector, or coordinates required' });
          }
          if (coordinates && (
            !Number.isFinite(coordinates.x) ||
            !Number.isFinite(coordinates.y) ||
            coordinates.x < 0 ||
            coordinates.y < 0
          )) {
            return res.status(400).json({ error: 'coordinates must contain non-negative numeric x and y' });
          }"""
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate click validation.")
          s = s.replace(old, new, 1)

          old = """      if (ref) {
          let locator = refToLocator(tabState.page, ref, tabState.refs);"""
          new = """      if (coordinates) {
          const viewport = tabState.page.viewportSize();
          if (!viewport ||
              coordinates.x >= viewport.width ||
              coordinates.y >= viewport.height) {
            throw new Error('Click coordinates are outside the browser viewport');
          }
          await tabState.page.mouse.click(coordinates.x, coordinates.y);
          log('info', 'coordinate mouse click dispatched', coordinates);
        } else if (ref) {
          let locator = refToLocator(tabState.page, ref, tabState.refs);"""
          if s.count(old) != 1:
              raise SystemExit("Could not safely locate click execution branch.")
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("Coordinate-click patch applied successfully.")
          PY

      - name: Start Camofox
        run: |
          cd /tmp/camofox-browser
          npm start > /tmp/camofox.log 2>&1 &
          echo $! > /tmp/camofox.pid

      - name: Wait for Camofox
        shell: bash
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9377/health; then
              echo
              echo "Camofox is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/camofox.pid)" 2>/dev/null; then
              cat /tmp/camofox.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/camofox.log
          exit 1

      - name: Open Craft World and inspect loading
        shell: bash
        run: |
          set -u

          BASE_URL="http://127.0.0.1:9377"
          USER_ID="github-actions-craft-world-test"
          SESSION_KEY="craft-world-mining-click-test"
          OUT="/tmp/craft-world-click-test"
          mkdir -p "$OUT"

          # Always preserve diagnostic output, even if a request fails.
          request() {
            curl -sS --max-time 30 "$@" || true
          }

          tab_response=$(curl --retry 3 --retry-delay 2 \
            --retry-connrefused -fsS \
            -X POST "$BASE_URL/tabs" \
            -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$USER_ID\",\"sessionKey\":\"$SESSION_KEY\",\"url\":\"https://craft-world.gg\"}") || {
              echo "Could not create browser tab."
              cat /tmp/camofox.log
              exit 1
            }

          printf '%s\n' "$tab_response" | tee "$OUT/tab-response.json" | jq .
          tab_id=$(printf '%s' "$tab_response" | jq -er '.tabId') || exit 1

          echo "Waiting for the page to settle..."
          request -X POST "$BASE_URL/tabs/$tab_id/wait" \
            -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$USER_ID\",\"timeout\":30000}" \
            > "$OUT/wait-response.json"

          # Give the game up to 120 seconds to finish its initial loading.
          # This workflow records the screen for review before clicking.
          for i in $(seq 1 12); do
            echo "Loading check $i of 12..."
            sleep 10

            request --get \
              --data-urlencode "userId=$USER_ID" \
              "$BASE_URL/tabs/$tab_id/screenshot" \
              -o "$OUT/screen-check-$i.png"

            request --get \
              --data-urlencode "userId=$USER_ID" \
              "$BASE_URL/tabs/$tab_id/evaluate" \
              > "$OUT/evaluate-check-$i.json" || true

            # Ask the page for basic render diagnostics.
            request -X POST "$BASE_URL/tabs/$tab_id/evaluate" \
              -H 'Content-Type: application/json' \
              -d "{\"userId\":\"$USER_ID\",\"expression\":\"JSON.stringify({url:location.href,title:document.title,bodyText:(document.body?.innerText||'').slice(0,1000),canvases:[...document.querySelectorAll('canvas')].map(c=>({width:c.width,height:c.height,rect:(()=>{const r=c.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}})()}))})\"}" \
              > "$OUT/page-check-$i.json"

            cat "$OUT/page-check-$i.json" || true
            echo
          done

          # Keep the last screenshot as the review image.
          cp "$OUT/screen-check-12.png" "$OUT/before-click.png" 2>/dev/null || true

          echo "Loading inspection finished."
          echo "No click has been sent yet."
          echo "Review before-click.png to confirm the actual game screen."
          echo "The shovel click will be enabled only after confirming the game is loaded."

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-world-mining-click-test
          path: /tmp/craft-world-click-test/
          if-no-files-found: warn
          retention-days: 3

      - name: Print Camofox logs
        if: always()
        run: |
          if [ -f /tmp/camofox.log ]; then
            tail -n 150 /tmp/camofox.log
          fi
